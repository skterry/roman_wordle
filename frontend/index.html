<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/*
  --word-len is set from JS once we know the secret word; CSS division by
  a unitless custom property is valid and lets the tile formula stay pure CSS.
*/
:root {
  --word-len: 5;
  --tile: min(56px, calc((100vw - 24px) / var(--word-len) - 5px));
  --key:  min(42px, calc((100vw - 14px - 45px) / 10));
}

body {
  font-family: Arial, sans-serif;
  background: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 8px 16px;
  -webkit-text-size-adjust: 100%;
  /*
    Prevent the iframe's overscroll from propagating to the outer Streamlit
    page and shifting the scroll position out from under the user.
  */
  overscroll-behavior: contain;
}

/* ── title ── */
.wl-title {
  font-size: 2.2rem; font-weight: 800; letter-spacing: 4px;
  text-align: center; color: #0b3d91; margin-bottom: 2px;
}
.wl-sub {
  font-size: 0.95rem; color: #888;
  text-align: center; margin-bottom: 12px;
}

/* ── message ── */
#message {
  height: 36px; line-height: 36px;
  font-size: 1.1rem; font-weight: 700;
  text-align: center; color: #1a1a1b;
  margin-bottom: 10px;
  min-width: min(300px, 92vw);
}
#message.win  { color: #6aaa64; }
#message.lose { color: #c0392b; }
#message.info { color: #555; }

/* ── board ── */
#board {
  display: flex; flex-direction: column; align-items: center;
  gap: 5px; margin-bottom: 14px;
}
.row { display: flex; gap: 5px; }
.tile {
  width: var(--tile); height: var(--tile);
  border: 2px solid #d3d6da;
  display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--tile) * 0.5); font-weight: bold;
  color: #1a1a1b; text-transform: uppercase;
  user-select: none; -webkit-tap-highlight-color: transparent;
}
.tile.filled   { border-color: #878a8c; animation: pop 0.08s ease-in-out; }
.tile.correct  { background: #6aaa64; color: #fff; border-color: #6aaa64; }
.tile.present  { background: #d4762a; color: #fff; border-color: #d4762a; }
.tile.absent   { background: #787c7e; color: #fff; border-color: #787c7e; }
.tile.revealed { background: #2e86de; color: #fff; border-color: #2e86de; }

@keyframes pop {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.12); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%       { transform: translateX(-5px); }
  40%       { transform: translateX(5px); }
  60%       { transform: translateX(-5px); }
  80%       { transform: translateX(5px); }
}

/* ── keyboard ── */
#keyboard { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.kb-row   { display: flex; gap: 5px; }
.key {
  height: calc(var(--key) * 1.33); min-width: var(--key);
  padding: 0 calc(var(--key) * 0.14);
  border: none; border-radius: 4px;
  background: #d3d6da;
  font-size: calc(var(--key) * 0.34 + 4px); font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  text-transform: uppercase; color: #1a1a1b;
  transition: background 0.2s, color 0.2s;
  user-select: none;
  /* Eliminate 300ms tap delay and prevent spurious scroll on key tap. */
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.key.wide    { min-width: calc(var(--key) * 1.57); font-size: calc(var(--key) * 0.3 + 3px); }
.key.correct { background: #6aaa64; color: #fff; }
.key.present { background: #d4762a; color: #fff; }
.key.absent  { background: #787c7e; color: #fff; }

#giveup-btn {
  margin-top: 14px; padding: 7px 22px;
  font-size: 0.9rem; font-weight: 700;
  color: #c0392b; background: #fff;
  border: 1.5px solid #c0392b; border-radius: 6px;
  cursor: pointer; transition: background 0.15s, color 0.15s;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
#giveup-btn:hover    { background: #c0392b; color: #fff; }
#giveup-btn:disabled { opacity: 0.35; cursor: default; }

.watermark {
  margin-top: 10px;
  font-size: 0.65rem; color: rgba(0,0,0,0.25);
  letter-spacing: 0.5px; pointer-events: none; user-select: none;
}

/* ── native keyboard hint (touch devices only) ── */
#kbd-hint {
  font-size: 0.85rem; color: #0b3d91; font-weight: 600;
  text-align: center; margin-bottom: 10px;
  cursor: pointer; user-select: none;
  border: 1px dashed #b8c4e0; border-radius: 6px; padding: 6px 12px;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
#kbd-hint:active { background: #eef2fb; }
@media (hover: hover) and (pointer: fine) { #kbd-hint { display: none; } }

/*
  position:fixed keeps iOS from scrolling the outer Streamlit page when this
  gains focus. position:absolute at top:0 made iOS scroll to y=0 on focus.
  font-size:16px prevents iOS auto-zoom.
*/
#hidden-input {
  position: fixed; top: -9999px; left: -9999px;
  height: 1px; width: 1px;
  opacity: 0; pointer-events: none;
  font-size: 16px; border: 0; padding: 0; background: transparent;
}
</style>
</head>
<body>

<div class="wl-title">ROMAN WORDLE</div>
<div class="wl-sub">One Roman Space Telescope-themed word per day!</div>
<div id="kbd-hint">⌨️ Tap here to type with your keyboard</div>
<div id="message"></div>
<div id="board"></div>
<div id="keyboard"></div>
<button id="giveup-btn" onclick="giveUp()">Give Up</button>
<div class="watermark">Created by: S. K. Terry</div>
<input id="hidden-input" type="text" inputmode="text" enterkeyhint="go"
       autocomplete="off" autocorrect="off"
       autocapitalize="characters" spellcheck="false"
       aria-hidden="true" tabindex="-1" />

<script>
// ══════════════════════════════════════════════════════════════════
//  Streamlit component bridge (vanilla postMessage, no React)
//  Same protocol as roman_scramble.
// ══════════════════════════════════════════════════════════════════
function _stPost(type, extra) {
  window.parent.postMessage(
    Object.assign({ isStreamlitMessage: true, type }, extra || {}), '*'
  );
}
function _stSetHeight(h) {
  _stPost('streamlit:setFrameHeight', { height: h });
}

let SECRET      = '';
let WORD_LEN    = 5;
let MAX_GUESSES = 6;
let ALLOWED     = new Set();
let _ready      = false;

window.addEventListener('message', function(event) {
  const data = event.data;
  if (!data || data.type !== 'streamlit:render') return;
  if (_ready) return;  // word is fixed for the day; ignore subsequent renders
  const args = data.args || {};
  SECRET  = (args.secret  || '').toUpperCase();
  ALLOWED = new Set(args.allowed || []);
  WORD_LEN = SECRET.length || 5;
  document.documentElement.style.setProperty('--word-len', WORD_LEN);
  hiddenInput.maxLength = WORD_LEN;
  _ready = true;
  buildBoard();
  buildKeyboard();
  // Set frame height once after layout paints. We never call _stSetHeight
  // again during gameplay — game content height doesn't change, and a live
  // ResizeObserver would make the outer page scroll on every DOM tweak.
  requestAnimationFrame(() => _stSetHeight(document.body.scrollHeight));
});

// Tell Streamlit we're ready to receive the first render with our args.
_stPost('streamlit:componentReady', { apiVersion: 1 });


// ══════════════════════════════════════════════════════════════════
//  Game state
// ══════════════════════════════════════════════════════════════════
let guesses  = [];
let current  = '';
let gameOver = false;
let checking = false;

const hiddenInput = document.getElementById('hidden-input');

async function isRealWord(word) {
  if (ALLOWED.has(word.toUpperCase())) return true;
  try {
    const resp = await fetch(
      'https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word.toLowerCase())
    );
    if (resp.ok)             return true;
    if (resp.status === 404) return false;
    return true;
  } catch (e) {
    return true;
  }
}

// ── DOM construction ──
function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let r = 0; r < MAX_GUESSES; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.id = 'row-' + r;
    for (let c = 0; c < WORD_LEN; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = 'tile-' + r + '-' + c;
      row.appendChild(tile);
    }
    board.appendChild(row);
  }
}

function buildKeyboard() {
  const rows = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['ENTER','Z','X','C','V','B','N','M','⌫']
  ];
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  for (const row of rows) {
    const div = document.createElement('div');
    div.className = 'kb-row';
    for (const k of row) {
      const btn = document.createElement('button');
      btn.className = 'key' + (k.length > 1 ? ' wide' : '');
      btn.textContent = k;
      btn.id = 'key-' + k;
      // touchstart fires instantly and preventDefault stops the touch from
      // registering as a scroll gesture on the Streamlit parent page.
      // The _touched flag prevents the browser's synthetic click from double-firing.
      let _touched = false;
      btn.addEventListener('touchstart', e => {
        e.preventDefault();
        _touched = true;
        handleKey(k);
      }, { passive: false });
      btn.addEventListener('click', () => { if (!_touched) handleKey(k); _touched = false; });
      div.appendChild(btn);
    }
    kb.appendChild(div);
  }
}

// ── input handling ──
function handleKey(key) {
  if (gameOver) return;
  if (key === '⌫' || key === 'Backspace') {
    current = current.slice(0, -1);
    renderCurrent();
  } else if (key === 'ENTER' || key === 'Enter') {
    submitGuess();
  } else if (/^[A-Za-z]$/.test(key) && current.length < WORD_LEN) {
    current += key.toUpperCase();
    renderCurrent();
  }
}

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (document.activeElement === hiddenInput) return;
  if      (e.key === 'Backspace')       handleKey('⌫');
  else if (e.key === 'Enter')           handleKey('Enter');
  else if (/^[A-Za-z]$/.test(e.key))   handleKey(e.key);
});

function renderCurrent() {
  if (hiddenInput.value !== current) hiddenInput.value = current;
  const r = guesses.length;
  for (let c = 0; c < WORD_LEN; c++) {
    const tile = document.getElementById('tile-' + r + '-' + c);
    const letter = current[c] || '';
    tile.textContent = letter;
    if (letter) {
      tile.classList.remove('filled');
      void tile.offsetWidth;
      tile.classList.add('filled');
    } else {
      tile.className = 'tile';
    }
  }
}

// ── evaluation ──
function evaluate(guess) {
  const result = new Array(WORD_LEN).fill('absent');
  const pool   = {};
  for (let i = 0; i < WORD_LEN; i++) {
    if (guess[i] === SECRET[i]) {
      result[i] = 'correct';
    } else {
      pool[SECRET[i]] = (pool[SECRET[i]] || 0) + 1;
    }
  }
  for (let i = 0; i < WORD_LEN; i++) {
    if (result[i] !== 'correct' && pool[guess[i]]) {
      result[i] = 'present';
      pool[guess[i]]--;
    }
  }
  return result;
}

// ── submission ──
async function submitGuess() {
  if (checking) return;
  if (current.length < WORD_LEN) {
    shakeRow(guesses.length);
    showMsg('Not enough letters', 'info');
    return;
  }

  const guess = current;
  checking = true;
  showMsg('Checking…', 'info');
  const valid = await isRealWord(guess);
  checking = false;
  if (gameOver) return;
  if (!valid) {
    shakeRow(guesses.length);
    showMsg('Not in word list', 'info');
    return;
  }

  showMsg('', '');
  const result = evaluate(guess);
  const rowIdx = guesses.length;

  guesses.push(guess);
  current = '';
  hiddenInput.value = '';

  const STEP = 280;
  for (let c = 0; c < WORD_LEN; c++) {
    const tile = document.getElementById('tile-' + rowIdx + '-' + c);
    ;(function(t, cls, delay) {
      setTimeout(() => {
        t.style.transition = 'transform 0.12s ease-in';
        t.style.transform  = 'scaleY(0)';
        setTimeout(() => {
          t.className        = 'tile ' + cls;
          t.style.transition = 'transform 0.12s ease-out';
          t.style.transform  = 'scaleY(1)';
        }, 120);
      }, delay);
    })(tile, result[c], c * STEP);
  }

  setTimeout(() => {
    updateKeyboard(guess, result);
    if (guess === SECRET) {
      gameOver = true;
      const msgs = ['Genius!', 'Magnificent!', 'Impressive!', 'Splendid!', 'Great!', 'Phew!'];
      showMsg(msgs[rowIdx] || 'Correct!', 'win');
    } else if (guesses.length === MAX_GUESSES) {
      gameOver = true;
      showMsg('The word was: ' + SECRET, 'lose');
    }
  }, WORD_LEN * STEP + 150);
}

function updateKeyboard(guess, result) {
  const pri = { correct: 3, present: 2, absent: 1 };
  for (let i = 0; i < WORD_LEN; i++) {
    const el = document.getElementById('key-' + guess[i]);
    if (!el) continue;
    const curPri = el.classList.contains('correct') ? 3
                 : el.classList.contains('present') ? 2
                 : el.classList.contains('absent')  ? 1 : 0;
    if (pri[result[i]] > curPri) {
      el.className = 'key' + (guess[i].length > 1 ? ' wide' : '') + ' ' + result[i];
    }
  }
}

function showMsg(text, cls) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.className   = cls || '';
  if (cls === 'info') {
    setTimeout(() => {
      if (el.textContent === text) { el.textContent = ''; el.className = ''; }
    }, 1400);
  }
}

function shakeRow(r) {
  const row = document.getElementById('row-' + r);
  row.style.animation = 'shake 0.4s ease';
  setTimeout(() => { row.style.animation = ''; }, 400);
}

// ── give up ──
function giveUp() {
  if (gameOver) return;
  if (!confirm('Give up and reveal the mystery word?')) return;
  gameOver = true;
  current  = '';
  hiddenInput.value = '';
  hiddenInput.blur();

  const rowIdx = guesses.length;
  const STEP   = 200;
  for (let c = 0; c < WORD_LEN; c++) {
    const tile = document.getElementById('tile-' + rowIdx + '-' + c);
    ;(function(t, letter, delay) {
      setTimeout(() => {
        t.textContent      = letter;
        t.style.transition = 'transform 0.12s ease-in';
        t.style.transform  = 'scaleY(0)';
        setTimeout(() => {
          t.className        = 'tile revealed';
          t.style.transition = 'transform 0.12s ease-out';
          t.style.transform  = 'scaleY(1)';
        }, 120);
      }, delay);
    })(tile, SECRET[c], c * STEP);
  }

  setTimeout(() => {
    showMsg('The word was: ' + SECRET, 'lose');
    document.getElementById('giveup-btn').disabled = true;
  }, WORD_LEN * STEP + 150);
}

// ── native keyboard support ──
// Only the hint banner triggers focus — removed board-click-to-focus
// so that tapping a tile to read it doesn't accidentally pop up the keyboard.
function focusInput() {
  if (gameOver) return;
  hiddenInput.focus({ preventScroll: true });
}
document.getElementById('kbd-hint').addEventListener('click', focusInput);

hiddenInput.addEventListener('input', () => {
  if (gameOver) { hiddenInput.value = ''; return; }
  const cleaned = hiddenInput.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, WORD_LEN);
  if (hiddenInput.value !== cleaned) hiddenInput.value = cleaned;
  current = cleaned;
  renderCurrent();
});

hiddenInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); submitGuess(); }
});
</script>
</body>
</html>
